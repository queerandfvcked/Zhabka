n Designer** в команду Content, которая создаёт и развивает контент внутри приложений Instories и Vids — шаблоны, AI-инструменты, эффекты и креативные решения для визуального контента пользователей. Мы исследуем новые направления, тестируем гипотезы и улучшаем пользовательский опыт на основе аналитики.\n\n**Что для нас важно:**\n◎ Профильное портфолио;\n◎ Интерес к мультизадачному развитию и работе с направлениями motion, graphic, AI;\n◎ Продвинутые навыки работы в видео редакторах (After Effects);\n◎ Навыки работы с AI инструментами (Midjourney, Nano Banana, ChatGPT, Kling, Seedance или аналогами);\n◎ Хороший визуальный вкус, насмотренность и понимание современных трендов в дизайне\n\n**Читать подробнее: **\n→[ Откликнуться тут](https://wantapply.com/content-designer-at-instories?utm_source=telegram&utm_medium=social&utm_campaign=organic_posts)", "link": "https://t.me/wantapply_design/513"}, {"channel_username": "huggabletalents", "channel_title": "A-Teams | Карьера", "date": "2026-08-17T13:04:18+00:00", "text": "В рубрике #карьерныйпуть мы говорим со специалистами из индустрии о том, как строился их карьерный путь: через разные роли, компании и решения.\n\n__⏮__[__Евгения Рыкалова__](https://t.me/angrypublisher)__ — издатель, медиаменеджер, с недавних пор директор управления брендами и IP «Союзмультфильм».____⏭__\n\nМое первое высшее образование — Московский энергетический институт. Я окончила его со степенью магистра информатики и вычислительной техники. А последнее образование получала уже во время пандемии — на факультете журналистики МГУ.\n\nМои первые подработки, как и у многих в студенчестве, никак не были связаны с будущей карьерой. Я вела детские праздники.\n\nВо время магистратуры я ушла в маркетинг розничного бизнеса: продавала компьютеры и открывала магазины Benetton для одного из франчайзи. Именно тогда я впервые поняла, что мне интересны не отдельные рекламные задачи, а запуск продукта целиком.\n\nВ 22 года я решила запустить типографский бизнес. Это была моя главная предпринимательская ошибка, но одновременно очень важная школа. Я соединила в себе два мира — маркетинг и полиграфическое производство — и поняла, как продукт создается физически и почему хорошая идея еще не гарантирует хороший результат.\n\nПосле этого я перешла в маркетинг типографий, а оттуда — в издательство «Манн, Иванов и Фербер». Так я и вошла в книжную индустрию: не напрямую через редактуру или любовь к литературе, а через производство, маркетинг и понимание продукта как системы.\n\n**⏮****Я все время меняю курс. Мое главное правило — не делать одно и то же дважды. Мне интересно брать новую задачу, разбираться в ней, выстраивать систему, а затем двигаться дальше. При этом я всегда говорю, что моя карьера — это сильная фортуна, замешанная на чутье.****⏭**\n\nКогда-то меня «принесло» в детское направление МИФа — как раз в момент взлета независимого детского книгоиздания. \n\nЗатем, на старте массового интереса к жанровой художественной литературе, я перешла в «Эксмо» заниматься продуктовой стратегией. А еще я параллельно носилась с презентацией нового книжного сервиса. Впервые показала эту идею в Сколково в 2018 году. Тогда рынок подписного чтения в России фактически ассоциировался с одним крупным игроком. Сегодня это уже самостоятельный и конкурентный сегмент.\n\n**⏮****Мой способ справляться с кризисами — не держаться за прежнюю роль. Я стараюсь вовремя увидеть, где появляется новое окно возможностей, и войти в него до того, как оно стало очевидным для всех.****⏭**\n\nПоследние несколько лет я вижу, что главное окно возможностей в российском контентном бизнесе — это создание крупного игрока в детском контенте. Книги в такой модели важны как источник уже проверенных историй и относительно недорогой способ тестировать новые IP, а анимация, кино и сериалы становятся основой для целой экосистемы продуктов.\n\nСовсем недавно я присоединилась к команде «Союзмультфильма». В рамках новой стратегии перед студией стоит задача стать контентным центром
