т еще и язык.\n\nЕсть слова, которые стоят дорого.\n\nА есть слова, которые делают вас дешевле еще до того, как вы дошли до обсуждения зарплаты.\n\nВот несколько примеров.\n\n**❌ Я трудоустроился в МТС.**\n**✅ Я присоединился к команде МТС.**\n\n**❌ Сколько вы платите?**\n**✅ Какой компенсационный пакет предусмотрен для этой роли?**\n\n**❌ Меня взяли на работу.**\n**✅ Мне сделали оффер.**\n\n**❌ Я занимался маркетингом.**\n**✅ Я управлял маркетинговым направлением.**\n\n**❌ Я был под коммерческим.**\n**✅ Я был в команде** **коммерческого директора.**\n\n**❌ Мне сказали заняться проектом трансформации продаж.**\n**✅ Я возглавил проект по трансформации продаж.**\n\n**❌ Я ушел и сейчас ищу работу.**\n**✅ Я сейчас рассматриваю новые карьерные возможности.**\n\n**❌ Я ухожу, потому что мало платят.**\n**✅ Позиция перестала** **соответствовать моим финансовым ожиданиям.**\n\nВажно понимать: дело не в том, чтобы говорить высокопарно или использовать модные слова.\n\nДело в том, что язык отражает ваше мышление.\n\nРуководитель не «просит зарплату». Он обсуждает компенсацию.\n\nНе «устраивается». Он принимает предложение.\n\nНе «делает, что сказали». Он влияет на результат и принимает решения.\n\nИ именно поэтому на интервью я всегда слушаю не только **что** говорит кандидат, но и **как** он это говорит.\n\nИногда несколько случайных слов снижают стоимость кандидата сильнее, чем отсутствие навыков или опыта.\n\n❓Что думаете? Согласны со мной?\nА какие слова на интервью, на ваш взгляд, моментально выдают уровень кандидата? Поделитесь в комментариях.", "link": "https://t.me/annaznamenskaya/1950"}, {"channel_username": "ya_jobs_pm", "channel_title": "Яндекс нанимает | Вакансии для PM", "date": "2026-07-18T15:03:57+00:00", "text": "**Проектный менеджер в команду Яндекс High\n**\nКоманда Яндекс High развивает стратегию и проекты в высшем образовании. Мы отвечаем за обучающие программы и интенсивы, взаимодействие с лабораториями Яндекса в вузах-партнёрах, научные исследования для ю     const list = document.getElementById('day-list');
    list.innerHTML = '';

    const allItem = document.createElement('li');
    allItem.className = 'day-item' + (activeDay === '__all__' ? ' active' : '');
    allItem.innerHTML = `<span>Всё</span><span class="count">${POSTS.length}</span>`;
    allItem.onclick = () => selectDay('__all__');
    list.appendChild(allItem);

    for (const [key, group] of dayMap.entries()) {
      const item = document.createElement('li');
      item.className = 'day-item' + (activeDay === key ? ' active' : '');
      item.innerHTML = `<span>${group.label}</span><span class="count">${group.posts.length}</span>`;
      item.onclick = () => selectDay(key);
      list.appendChild(item);
    }

    const channelsCount = new Set(POSTS.map(p => p.channel_username)).size;
    document.getElementById('sidebar-foot').textContent = `источников: ${channelsCount}`;
  }

  function renderMain() {
    const posts = activeDay === '__all__' ? POSTS : dayMap.get(activeDay).posts;
    const title = activeDay === '__all__' ? 'Всё' : dayMap.get(activeDay).label;

    document.getElementById('main-title').textContent = title;
    document.getElementById('topbar-title').textContent = title;
    document.getElementById('receipt-left').textContent = `улов: ${posts.length} постов`;
    document.getElementById('receipt-right').textContent = `источников: ${new Set(posts.map(p => p.channel_username)).size}`;

    const feed = document.getElementById('feed');
    const empty = document.getElementById('empty');
    feed.innerHTML = '';
    empty.style.display = posts.length === 0 ? 'block' : 'none';

    posts.forEach((post, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-meta">
          <span class="channel">@${post.channel_username}</span>
          <span>${timeStr(post.date)}</span>
        </div>
        <p class="card-text" id="text-${i}">${post.text.replace(/</g, '&lt;')}</p>
        <div class="card-footer">
          <button class="toggle" onclick="toggleText(${i})">развернуть</button>
          <a class="open-link" href="${post.link}" target="_blank" rel="noopener">Открыть в Telegram</a>
        </div>
      `;
      feed.appendChild(card);
    });
  }

  function selectDay(key) {
    activeDay = key;
    renderSidebar();
    renderMain();
    toggleSidebar(false);
  }

  function toggleSidebar(open) {
    document.getElementById('sidebar').classList.toggle('open', open);
  }

  function toggleText(i) {
    document.getElementById(`text-${i}`).classList.toggle('expanded');
  }

  renderSidebar();
  renderMain();
</script>
</body>
</html>
