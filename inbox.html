 приходило на психологические и юридические консультации приходит топ-менеджеров и руководителей – дохера. Нет такого, что бичи с таким сталкиваются, а другие нет. \n\nТочно также вы, наверное, удивитесь, но среди состоявшихся в карьере людей есть игроманы, алкоголики, наркоманы. Однажды даже консультировала человека после года в рехабе и продумывали план возврата на руководящую позицию. \n\n**2. Насилие бывает разных видов**, не обязательно кулак в лицо. \n\nДомашнее насилие не всегда приобретает физическую форму: толчки, хватание, удары, удушение, пинки, ожоги, щипки, пощечины, вовлечение в употребление наркотиков и алкоголя, принуждение к приему медицинских препаратов и отравляющих средств. Также выделяют: психологическое, сексуализированное, экономическое, вредные практики (калечащие операции на женских половых органах, детские и/или принудительные браки, преступления, совершенные в «защиту чести»); репродуктивное; материальное (порча имущества); цифровое (преследование в социальных сетях); сепарационное (в период расставания/развода или после расставания/развода).\n\n\n3. Я знаю, что там есть циклы ухода из таких отношений и зачастую человеку надо сделать 5-7 попыток, чтобы окончательно разорвать такие отношения, но все-таки **обращение к психологу может помочь и ускорить этот процесс. **Есть НКО, которые помогают в таких ситуациях, например, [НеТерпи](https://neterpi.com/), [ТыНеОдна](https://tineodna.ru/), [Сестры](https://sisters-help.ru/), а также юридическая помощь в [Консорциуме](https://wcons.net/). Можно получить психологическую и юридическую помощь, а также по стране есть шелтеры, где можно разместиться. \n\nСпойлер – дальше это мое мнение, как человека, а не как специалиста. \n\n4. Частая история в наших семьях, когда отец пьет и бьет, а мать с ребенком страдает. **Только вот я в таком конструкте вижу не одного агрессора, а целых двух** – потому что один делает активные действия, а второй своим бездействитем и тем, что он оставляет ребенка в опасности нас были»__\n\n3️⃣ **Укажи управленческий рычаг — это прямой ответ на «а ты-то что сделал(а)?»**\n\nНе __«команда вышла на рынок»__, а __«я это обеспечил(а) за счёт [найма / процессов / приоритизации / стратегии / удержания людей]»__.\n\nТы не рисовал(а) макеты и не писал(а) код — ты собрал(а) людей, которые это сделали, и создал(а) условия, в которых они смогли добиться таких результатов. \n\n4️⃣ **Разреши себе присваивать результат команды**\n\nМногие руководители стесняются это делать и уходят в обтекаемые формулировки. Прямо разреши себе: результат команды в твоей зоне — твой результат, если ты приложил(а) управленческий рычаг.\n\nФормулировки __«под моим руководством» или «я обеспечил(а), чтобы»__ честно и адекватно описывают то, за что ты отвечал(а).\n\n__Примеры того, как можно сформулировать результаты в зависимости от грейда — в комментариях к посту__ 💬\n\nЕсли твои результаты на руководящей позиции звучат как список задач исполнителя, — скорее всего ты продаёшь себя дешевле, чем стоишь. \n\nНа курсе Hello New Job! ты поймёшь, на что обращает внимание работодатель, проанализируешь собственные результаты и потренируешься рассказывать о них. \n\n**В итоге на реальном собеседовании ты будешь звучать как кандидат, с которым хочется работать.**\n\n🎃 Старт XI потока запланирован на осень 2026\n\nЧтобы не пропустить открытие набора и получить от нас специальное предложение — запишись в список предзаписи. \n\n✍️ [**Записаться**](https://t.me/hellonewjob_bot?start=id587691846)", "link": "https://t.me/hellonewjob/2262"}, {"channel_username": "theblueprintcareer", "channel_title": "«Карьера» The Blueprint", "date": "2026-07-21T09:15:37+00:00", "text": "Сбер ищет **PR-менеджера блока «Люди и культура»**.\nhttps://theblueprint.ru/l/hH2sz6O\n\n#Москва@theblueprintcareer\n#ВакансияВКультуре@theblueprintcareer\n#ВакансияВPR@theblueprintcareer\n🤍[ ваши карьерные новости](https://t.me/theblueprintcareer/11048)", "link": "https://t.me/theblueprintcareer/11240"}, {"channel_use     dayMap.get(key).posts.push(p);
  });

  let activeDay = '__all__';

  function renderSidebar() {
    const list = document.getElementById('day-list');
    list.innerHTML = '';

    const allItem = document.createElement('li');
    allItem.className = 'day-item' + (activeDay === '__all__' ? ' active' : '');
    allItem.innerHTML = `<span>Всё</span><span class="count">${POSTS.length}</span>`;
    allItem.onclick = () => selectDay('__all__');
    list.appendChild(allItem);

    for (const [key, group] of dayMap.entries()) {
      const item = document.createElement('li');
      item.className = 'day-item' + (activeDay === key ? ' active' : '');
      item.innerHTML = `<span>${group.label}</span><span class="count">${group.posts.length}</span>`;
      item.onclick = () => selectDay(key);
      list.appendChild(item);
    }

    const channelsCount = new Set(POSTS.map(p => p.channel_username)).size;
    document.getElementById('sidebar-foot').textContent = `источников: ${channelsCount}`;
  }

  function renderMain() {
    const posts = activeDay === '__all__' ? POSTS : dayMap.get(activeDay).posts;
    const title = activeDay === '__all__' ? 'Всё' : dayMap.get(activeDay).label;

    document.getElementById('main-title').textContent = title;
    document.getElementById('topbar-title').textContent = title;
    document.getElementById('receipt-left').textContent = `улов: ${posts.length} постов`;
    document.getElementById('receipt-right').textContent = `источников: ${new Set(posts.map(p => p.channel_username)).size}`;

    const feed = document.getElementById('feed');
    const empty = document.getElementById('empty');
    feed.innerHTML = '';
    empty.style.display = posts.length === 0 ? 'block' : 'none';

    posts.forEach((post, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-meta">
          <span class="channel">@${post.channel_username}</span>
          <span>${timeStr(post.date)}</span>
        </div>
        <p class="card-text" id="text-${i}">${post.text.replace(/</g, '&lt;')}</p>
        <div class="card-footer">
          <button class="toggle" onclick="toggleText(${i})">развернуть</button>
          <a class="open-link" href="${post.link}" target="_blank" rel="noopener">Открыть в Telegram</a>
        </div>
      `;
      feed.appendChild(card);
    });
  }

  function selectDay(key) {
    activeDay = key;
    renderSidebar();
    renderMain();
    toggleSidebar(false);
  }

  function toggleSidebar(open) {
    document.getElementById('sidebar').classList.toggle('open', open);
  }

  function toggleText(i) {
    document.getElementById(`text-${i}`).classList.toggle('expanded');
  }

  renderSidebar();
  renderMain();
</script>
</body>
</html>
