отразить parental leave в списке мест работы? Понимаю, что мне надо этот период уложить в отдельный блок, хотя бы для того, чтобы указать там учёбу в результатах. Указать датой окончания работы на текущем месте, когда я ушла в декрет, — или как-то иначе?**\n**\nТакой вопрос задала студентка X потока, который идёт прямо сейчас. Отвечает Кира Кузьменко, рекрутер c 20-летним опытом в IT: \n\n1️⃣ **Что писать в датах**\n\nДекрет и отпуск по уходу за ребёнком — это не окончание работы. В этот период формально ты всё ещё сотрудник.\n\n• __Если ты в декрете и не уволилась __— период работы идёт по настоящее время. Обучение в этом случае укажи не отдельно от мест работы, а строкой внутри блока текущего места или в разделе «Дополнительное образование». \n\n• __Если уже уволилась__ — начало parental leave — это дата увольнения. И дальше идёт перерыв, его логично оформить отдельным блоком, в котором можно указать и учёбу и пет проекты.\n\n**Например так ⤵️**\n\nCareer break — parental leave, 2023–2025 \n— прошла [курс], освоила [что] \n— пет-проект / фриланс [если было]\n\n**2️⃣ Что додумывает работодатель и что с этим делать**\n\nСам факт декрета не так пугает пугливого и предвзятого работодателя, как пугает то, что он додумывает. А додумывает он вот что:\n\n__🗯____ За это время рынок развивался, менялся и шёл вперёд, а ты отстала от него__\n\n**Как это перекрыть: **\n🗣 Покажи, как ты держала руку на пульсе, например: проходила курс, делала пет-проект, работала парт-тайм, проводила консультации\n\n__🗯__ __Голова будет занята ребёнком, будешь ходить на больничные, а не работать__ \n\n**Как это перекрыть: **\n🗣 Расскажи кейсы с фактами и примерами, где ты вывозила сроки и брала ответственность\n\n__🗯__ Увязла в декрете и раскачаешься только через полгода. А у нас другой темп, нужно работать прямо сейчас \n\n**Как это перекрыть: **\n🗣 Покажи (это больше на собесе), что ты готова к интенсивной работе, у тебя есть энергия и желание брать задачи с первых дней\n**\n3️⃣ План Б, если ли общие знакомые или точки пересечения? Чем лучше вы понимаете человека напротив, тем легче выстроить разговор.\n\n**3. Отрепетируйте ответы на сложные вопросы**\n«Расскажите о конфликте», «Ваш главный провал», «Почему ушли?», «Почему именно вы?». На самом интервью импровизировать поздно. Проговорите ответы вслух несколько раз, лучше записав себя на видео. Большинство людей не замечают своих слов-паразитов, слишком длинных ответов и нервных жестов.\n\n**4. Подготовьте мастер-файл достижений**\nСоберите хотя бы 3-5 сильных кейса с цифрами, результатами и выводами. Чтобы под любой вопрос на интервью - про лидерство, кризисы, влияние или управление командой - можно было достать ответ из этого файла. Не пытайтесь вспоминать истории на ходу.\n\n**5. Следите за темпом речи**\nНе тараторьте из-за волнения, но и не превращайте ответы в медленные лекции. Делайте паузы, чтобы мысль звучала убедительно. Улыбайтесь, поддерживайте зрительный контакт и не бойтесь нескольких секунд тишины - уверенные люди не заполняют каждую паузу словами.\n\n**6. Не теряйтесь в неудобных ситуациях**\nЕсли интервьюер смотрит в телефон, перебивает или задаёт жёсткие вопросы - не воспринимайте это как личную атаку. Сохраняйте спокойствие, возвращайте разговор к сути и при необходимости вежливо уточняйте вопрос. Интервью - это диалог двух равных профессионалов, а не экзамен.\n\n**7. Подготовьте вопросы к компании**\nСильных кандидатов отличает не только качество ответов, но и качество вопросов. Спросите о целях роли на первые 6–12 месяцев, критериях успеха, ожиданиях руководителя, главных вызовах бизнеса, причинах открытия вакансии, культуре команды и стратегии компании. Именно ваши вопросы часто показывают уровень опыта лучше любого резюме.\n\n**Что бы вы добавили сюда?**\n\nЕсли было полезно - ♻️ поделитесь с друзьями!\n\nПодписывайтесь на @annaznamenskaya\nЗдесь про поиск работы и карьерный рост", "link": "https://t.me/annaznamenskaya/1957"}, {"channel_username": "huggabletalents", "channel_title   const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

  function dateKey(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }
  function dayLabel(iso) {
    const d = new Date(iso);
    const today = new Date();
    const yest = new Date(); yest.setDate(today.getDate() - 1);
    if (dateKey(iso) === dateKey(today.toISOString())) return 'Сегодня';
    if (dateKey(iso) === dateKey(yest.toISOString())) return 'Вчера';
    return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
  }
  function timeStr(iso) {
    return new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }

  // группировка по дням, сохраняя порядок появления (уже отсортировано по убыванию даты)
  const dayMap = new Map(); // key -> { label, posts: [] }
  POSTS.forEach(p => {
    const key = dateKey(p.date);
    if (!dayMap.has(key)) dayMap.set(key, { label: dayLabel(p.date), posts: [] });
    dayMap.get(key).posts.push(p);
  });

  let activeDay = '__all__';

  function renderSidebar() {
    const list = document.getElementById('day-list');
    list.innerHTML = '';

    const allItem = document.createElement('li');
    allItem.className = 'day-item' + (activeDay === '__all__' ? ' active' : '');
    allItem.innerHTML = `<span>Всё</span><span class="count">${POSTS.length}</span>`;
    allItem.onclick = () => selectDay('__all__');
    list.appendChild(allItem);

    for (const [key, group] of dayMap.entries()) {
      const item = document.createElement('li');
      item.className = 'day-item' + (activeDay === key ? ' active' : '');
      item.innerHTML = `<span>${group.label}</span><span class="count">${group.posts.length}</span>`;
      item.onclick = () => selectDay(key);
      list.appendChild(item);
    }

    const channelsCount = new Set(POSTS.map(p => p.channel_username)).size;
    document.getElementById('sidebar-foot').textContent = `источников: ${channelsCount}`;
  }

  function renderMain() {
    const posts = activeDay === '__all__' ? POSTS : dayMap.get(activeDay).posts;
    const title = activeDay === '__all__' ? 'Всё' : dayMap.get(activeDay).label;

    document.getElementById('main-title').textContent = title;
    document.getElementById('topbar-title').textContent = title;
    document.getElementById('receipt-left').textContent = `улов: ${posts.length} постов`;
    document.getElementById('receipt-right').textContent = `источников: ${new Set(posts.map(p => p.channel_username)).size}`;

    const feed = document.getElementById('feed');
    const empty = document.getElementById('empty');
    feed.innerHTML = '';
    empty.style.display = posts.length === 0 ? 'block' : 'none';

    posts.forEach((post, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-meta">
          <span class="channel">@${post.channel_username}</span>
          <span>${timeStr(post.date)}</span>
        </div>
        <p class="card-text" id="text-${i}">${post.text.replace(/</g, '&lt;')}</p>
        <div class="card-footer">
          <button class="toggle" onclick="toggleText(${i})">развернуть</button>
          <a class="open-link" href="${post.link}" target="_blank" rel="noopener">Открыть в Telegram</a>
        </div>
      `;
      feed.appendChild(card);
    });
  }

  function selectDay(key) {
    activeDay = key;
    renderSidebar();
    renderMain();
    toggleSidebar(false);
  }

  function toggleSidebar(open) {
    document.getElementById('sidebar').classList.toggle('open', open);
  }

  function toggleText(i) {
    document.getElementById(`text-${i}`).classList.toggle('expanded');
  }

  renderSidebar();
  renderMain();
</script>
</body>
</html>
