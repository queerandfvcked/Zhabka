г раньше и у кого всё ещё есть бюджет на рост\n2. Те, кому нужно закрыть replacement на уже существующую позицию\n\nА вот желания создавать много нового headcount я сейчас практически не вижу.\n\nИ особенно интересно это выглядит с учётом времени года.\n\nОбычно сентябрь-октябрь - это как раз период, когда рынок начинает оживать и компании активируют позиции под Q1 следующего года.\n\nНо сейчас открытых ролей явно меньше, чем в это же время год назад.\n\nПлюс компании стали намного дольше принимать решения.\n\nИ ещё один тренд, который я вижу всё чаще: вместо того чтобы нанимать новых людей, компании перераспределяют работу внутри существующих команд и ожидают, что сотрудники разберутся, как использовать AI, чтобы делать больше тем же составом.\n\nМне буквально недавно hiring manager сказал, что они решили вообще не открывать одну из позиций, потому что считают, что значительную часть этой работы можно заменить AI.\n\nПоэтому мой совет сейчас такой:\n\n1) Если вы уже работаете и ваша позиция достаточно стабильна, я бы не спешила уходить, пока у вас нет на руках действительно хорошего оффера.\n\n2) Если вы сейчас ищете работу, запаситесь терпением. Рынок не умер, но двигается гораздо медленнее.\n\nИ в зависимости от вашего профиля я бы сейчас также рассматривала другие рынки, а не ограничивалась только ОАЭ.", "link": "https://t.me/growwithdaria/513"}, {"channel_username": "dashich_begi", "channel_title": "Дашич, беги🚀", "date": "2026-10-06T06:30:00+00:00", "text": "/Рынок труда в ближайшие 10 лет: AI сможет делать половину нашей работы. Но это не значит, что половина людей останется без работы. Часть 2/\n**\n**Продолжаю разбирать отчет McKinsey про рынок труда до 2035 года. В [первой части ](https://t.me/dashich_begi/2445?single)мы выяснили, что нас ждет скорее гигантское перераспределение работы, чем ее исчезновение. А сегодня прекрасная иллюстрация, почему «AI может автоматизировать половину работы» ≠ «половина людей останется без работы».\n**\n**По оценке McKinsey, к 2035 году AI и другие технологии автоматизации потенциально смогут забрать на себя работу, которая сегодня занимает около **54% рабочего времени американцев**.\nНо реальное снижение спроса на человеческий труд они оценивают всего примерно в **21% сегодняшних рабочих часов**. То есть около **60% потенциального эффекта автоматизации вообще не превратится в сокращение человеческого труда** - и на это есть четыре причины.\n\nВо-первых, где-то AI просто снимет существующую перегрузку. Если медсестры постоянно работают сверхурочно из-за нехватки людей, автоматизация части задач может означать не сокращение медсестер, а наконец нормальный рабочий день [стройная теория, будем верить!!]\n\nВо-вторых, рост производительности может привести к росту спроса. Если благодаря AI услуга становится дешевле, быстрее или качественнее, мы начинаем потреблять ее больше. В отчете приводят исследование аудиторов: после внедрения AI их занятость выросла на 4,3%, одновременно выросло и качество аудита.\n\nВ-третьих, внутри старых профессий появляется новая работа. Мы меньше времени тратим на первый драфт, поиск информации и рутинные ответы, зато больше на проверку AI, сложные случаи, контроль качества и координацию AI-процессов.\n\nНу и в-четвертых, не всё, что технически можно автоматизировать, можно просто превратить в сокращение человека: мешают регулирование, ответственность, устройство процессов, договоры и куча других ограничений.\n\nНу и помним важное: профессия - это не одна задача, а связка разных видов деятельности, а еще и определенное место и роль в большой системе - согласований и договоренностей, чтобы вся эта большая система работала. AI может научиться очень хорошо выполнять одну из них, но это еще не означает, что вместе с ней исчезает вся профессия.\nНас ждет, видимо, большая пертурбация задач внутри профессий, а не полное исчезновение профессий.\n\n[источник](https://www.mckinsey.com/mgi/our-research/Workforce-in-motion-Skills-and-pathways-to-future-jobs-in-the-United- ответствия растёт, резюме чаще рекомендуется рекрутерам.\n\n→ **Свежесть.** Резюме, обновлённое за последние 1–3 дня, идёт выше. Заходите и обновляйте каждый день — отредактировали и сохранили, дата освежилась. Бесплатно и работает лучше всего.\n\n→ **Полнота** **резюме.** Цельтесь в 100%, минимум 75–80%. Базовый набор полей даёт всего ~51%.\n\n→ **Подтверждённые навыки.** Пройдите тесты hh (английский, Excel — есть почти под любую профессию). Подтверждённый навык поднимает резюме выше.\n\n→ **Активность**. Статус «Активно ищу работу», регулярные заходы, просмотр вакансий — всё это алгоритм учитывает.\n\n**Алгоритм под каждую вакансию (а не одно резюме на всё)\n**\n1. Делаете отдельные резюме под разные роли.\n2. Название резюме = точное название целевой вакансии.\n3. Ключевые слова из вакансии вставляете не только в навыки, но и в опыт и «обо мне» — показываете, как именно применяли.\n4. Сопроводительное — точечное под вакансию, а не один шаблон на 100 компаний.\n5. Откликаетесь прицельно. Релевантность важнее объёма, потому что алгоритм учится на реакциях рекрутеров. Поток нерелевантных откликов размывает вашу выдачу и все предыдущие усилия бессмысленными становятся.\n\n**Чего точно не делать :**\n\n→ Не засовывать белый текст с ключевиками под цвет фона. Это работало пару лет на международном рынке, особенно на рынке США. Сейчас hh понимает синонимы и смысл, а не тупо ищет слова — приём бесполезен и палится.\n→ Не держать одно универсальное резюме на 50% заполнения.\n→ Не спамить откликами на всё подряд.\n\nВместо вывода: на hh вы фильтры не обходите — вы под них настраиваетесь. Совпадение по навыкам + свежесть + полнота + точное название = вы в топе ещё до того, как вас увидел живой человек.\n\nЛайки и шеры — лучшая ваша благодарность за контент ❤️\n\n#поискработы #резюме", "link": "https://t.me/bezaspera/3007"}, {"channel_username": "jobs_it", "channel_title": "💻☕️ Jobs_IT", "date": "2026-10-06T06:25:14+00:00", "text": "Masg me", "link": "https://t.me/jobs_it/2   const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

  function dateKey(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }
  function dayLabel(iso) {
    const d = new Date(iso);
    const today = new Date();
    const yest = new Date(); yest.setDate(today.getDate() - 1);
    if (dateKey(iso) === dateKey(today.toISOString())) return 'Сегодня';
    if (dateKey(iso) === dateKey(yest.toISOString())) return 'Вчера';
    return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
  }
  function timeStr(iso) {
    return new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }

  // группировка по дням, сохраняя порядок появления (уже отсортировано по убыванию даты)
  const dayMap = new Map(); // key -> { label, posts: [] }
  POSTS.forEach(p => {
    const key = dateKey(p.date);
    if (!dayMap.has(key)) dayMap.set(key, { label: dayLabel(p.date), posts: [] });
    dayMap.get(key).posts.push(p);
  });

  let activeDay = '__all__';

  function renderSidebar() {
    const list = document.getElementById('day-list');
    list.innerHTML = '';

    const allItem = document.createElement('li');
    allItem.className = 'day-item' + (activeDay === '__all__' ? ' active' : '');
    allItem.innerHTML = `<span>Всё</span><span class="count">${POSTS.length}</span>`;
    allItem.onclick = () => selectDay('__all__');

      item.onclick = () => selectDay(key);
      list.appendChild(item);
    }

    const channelsCount = new Set(POSTS.map(p => p.channel_username)).size;
    document.getElementById('sidebar-foot').textContent = `источников: ${channelsCount}`;
  }

  function renderMain() {
    const posts = activeDay === '__all__' ? POSTS : dayMap.get(activeDay).posts;

    document.getElementById('main-title').textContent = title;

    const feed = document.getElementById('feed');
    const empty = document.getElementById('empty');
    feed.innerHTML = '';

      const card = document.createElement('div');
      card.className = 'card';

      `;

  }

  function selectDay(key) {
