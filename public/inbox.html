, что невозможно собрать одно «универсальное» резюме, ведь твой опыт может быть куда шире вакансии. Даже название роли может отличаться в разных компаниях и на разных рынках.\n\nПоэтому резюме нужно редактировать с прицелом на конкретную вакансию: оставлять только стопроцентно релевантный опыт и по возможности использовать те же формулировки, что и работодатель.\n\n**Пример:** сеньорные кандидаты рассматривают и линейные, и управленческие вакансии, а ключевые навыки на этих ролях отличаются кардинально. Если описать весь опыт вперемешку, работодатель, скорее всего, понизит приоритет такого отклика.\n\nHH тоже это понимает и поэтому даёт возможность иметь до 20 активных резюме в одном аккаунте. Раньше их можно было создавать и редактировать по отдельности.\n\n🆕 **Что изменилось в 2026?**\n\nТеперь образование и опыт работы привязаны к твоему профилю кандидата — здесь хранится вся информация, которую ты публикуешь. HH называет это «цифровым паспортом» и автоматически синхронизирует почти все данные между профилем и разными версиями резюме.\n\n**Что всё ещё можно редактировать в каждом отдельном варианте:**\n• название резюме\n• фото\n• желаемую роль и условия\n• контакты\n• навыки\n• дополнительные разделы (портфолио, рекомендации, сертификаты и т. д.)\n\n**Что меняется автоматом во всех CV:**\n• личные данные (ФИО, дата рождения, разрешение на работу и т. д.)\n• знание языков\n• регион поиска\n• и главное — твои прошлые места работы, включая описания ролей и достижений\n\n**Например: **ты редактор рекрутингового агентства NEWHR и описываешь этот опыт в резюме. Теперь, если изменить его в профиле или в любом из CV — опыт обновится во всех резюме (но есть нюанс — о нём ниже).\n\n❓ **Как теперь делать кастомные отклики?**\n\nОтставить панику: опция кастомных резюме никуда не делась. И кажется, создавать их стало даже удобнее! \n\nПредставь, что каждое резюме — это конструктор. Все элементы конструктора хранятся в твоём профиле, поэтому изменения в одном варианте влияют на остальные. Но ты всё ещё выбираешь, какие блоки показывать в каждом CV.\n\nРаботодатель не видит твой профиль, только опубликованные резюме — так что все элементы конструктора доступны только тебе.\n\nНерелевантные места работы можно скрыть в каждом конкретном резюме. А если хочешь описать опыт в одной и той же компании по-разному — просто добавь компанию в профиль несколько раз. Это совершенно нормально (такой совет даёт официальная база знаний HH).\n\n**Как упомянуть нужный опыт в CV на HH:**\n\n1️⃣ Добавь нужную компанию в профиль кандидата — можно несколько раз, даже с одним и тем же названием и датами работы.\n\n2️⃣ В каждом варианте укажи результаты, которые важно подчеркнуть при разных откликах (например, в одном — опыт тимлида, в другом — харды линейного специалиста).\n\n3️⃣ При сборке резюме выбери, какой из вариантов описания роли в нём упомянуть.\n\nПеред публикацией нового резюме проверь, не подтянулась ли в него задублированная информация из профиля или не тот вариант описания, который ты хочешь подчеркнуть в этом CV.\n\nЕсли у тебя несколько резюме — просмотри старые варианты, они тоже могли измениться после обновления.\n\n⚠️ **Важный нюанс: **если у тебя несколько открытых резюме, рекрутер сможет просмотреть их все. Не забывай скрывать неактуальные CV и оставлять видимыми только приоритетные прямо сейчас. \n\n__Больше про резюме: ____#резюме_hello_new_job__\n\n🌟 Старт XI потока Hello New Job! запланирован на осень 2026. Записаться в список предзаписи — [по ссылке.](https://t.me/hellonewjob_bot?start=id587691846)", "link": "https://t.me/hellonewjob/2257"}, {"channel_username": "uiux_jobs_resumes", "channel_title": "UI/UX Jobs — канал вакансий и резюме дизайнеров", "date": "2026-07-16T11:10:48+00:00", "text": "Привет! Ищу проекты и партнёрства — UX/UI-дизайнер, веб-дизайн для бизнеса\n\nЯ Рената, UX/UI-дизайнер, работаю с сайтами для e-commerce и B2B — от аналитики и UX-стратегии до готового запущенного сайта. \n\nНемного о последних проектах:\n\nTEX   const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

  function dateKey(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }
  function dayLabel(iso) {
    const d = new Date(iso);
    const today = new Date();
    const yest = new Date(); yest.setDate(today.getDate() - 1);
    if (dateKey(iso) === dateKey(today.toISOString())) return 'Сегодня';
    if (dateKey(iso) === dateKey(yest.toISOString())) return 'Вчера';
    return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
  }
  function timeStr(iso) {
    return new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }

  // группировка по дням, сохраняя порядок появления (уже отсортировано по убыванию даты)
  const dayMap = new Map(); // key -> { label, posts: [] }
  POSTS.forEach(p => {
    const key = dateKey(p.date);
    if (!dayMap.has(key)) dayMap.set(key, { label: dayLabel(p.date), posts: [] });
    dayMap.get(key).posts.push(p);
  });

  let activeDay = '__all__';

  function renderSidebar() {
    const list = document.getElementById('day-list');
    list.innerHTML = '';

    const allItem = document.createElement('li');
    allItem.className = 'day-item' + (activeDay === '__all__' ? ' active' : '');
    allItem.innerHTML = `<span>Всё</span><span class="count">${POSTS.length}</span>`;
    allItem.onclick = () => selectDay('__all__');
    list.appendChild(allItem);

    for (const [key, group] of dayMap.entries()) {
      const item = document.createElement('li');
      item.className = 'day-item' + (activeDay === key ? ' active' : '');
      item.innerHTML = `<span>${group.label}</span><span class="count">${group.posts.length}</span>`;
      item.onclick = () => selectDay(key);
      list.appendChild(item);
    }

    const channelsCount = new Set(POSTS.map(p => p.channel_username)).size;
    document.getElementById('sidebar-foot').textContent = `источников: ${channelsCount}`;
  }

  function renderMain() {
    const posts = activeDay === '__all__' ? POSTS : dayMap.get(activeDay).posts;
    const title = activeDay === '__all__' ? 'Всё' : dayMap.get(activeDay).label;

    document.getElementById('main-title').textContent = title;
    document.getElementById('topbar-title').textContent = title;
    document.getElementById('receipt-left').textContent = `улов: ${posts.length} постов`;
    document.getElementById('receipt-right').textContent = `источников: ${new Set(posts.map(p => p.channel_username)).size}`;

    const feed = document.getElementById('feed');
    const empty = document.getElementById('empty');
    feed.innerHTML = '';
    empty.style.display = posts.length === 0 ? 'block' : 'none';

    posts.forEach((post, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-meta">
          <span class="channel">@${post.channel_username}</span>
          <span>${timeStr(post.date)}</span>
        </div>
        <p class="card-text" id="text-${i}">${post.text.replace(/</g, '&lt;')}</p>
        <div class="card-footer">
          <button class="toggle" onclick="toggleText(${i})">развернуть</button>
          <a class="open-link" href="${post.link}" target="_blank" rel="noopener">Открыть в Telegram</a>
        </div>
      `;
      feed.appendChild(card);
    });
  }

  function selectDay(key) {
    activeDay = key;
    renderSidebar();
    renderMain();
    toggleSidebar(false);
  }

  function toggleSidebar(open) {
    document.getElementById('sidebar').classList.toggle('open', open);
  }

  function toggleText(i) {
    document.getElementById(`text-${i}`).classList.toggle('expanded');
  }

  renderSidebar();
  renderMain();
</script>
</body>
